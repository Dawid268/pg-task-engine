name: Publish verified Python distributions

# Deliberately no push/tag trigger. A release must be started manually on a
# matching, immutable version tag by an operator with repository access.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Target Python package index"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      confirmation:
        description: "Type PUBLISH to confirm this explicit upload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-distribution:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_engine
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: pg_task_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_engine -d pg_task_engine_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_TASK_ENGINE_TEST_DSN: postgresql://task_engine:isolated_ci_password@127.0.0.1:5432/pg_task_engine_test
    steps:
      - name: Verify deliberate tag-based publishing request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag" || { echo "Select a version tag, not a branch"; exit 1; }
          test "$CONFIRMATION" = "PUBLISH" || { echo "Confirmation must be PUBLISH"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || {
            echo "Invalid semantic version tag"; exit 1;
          }

      - name: Checkout immutable tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify tag matches package metadata
        run: |
          uv run --locked python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == "v" + project["version"], (
              f"Tag {tag} differs from pyproject.toml version {project['version']}"
          )
          PY

      - name: Static analysis and PostgreSQL integration tests
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src app tests examples run.py
          uv run --locked pytest -q

      - name: Audit locked runtime dependencies
        run: |
          uv export --no-dev --no-hashes --no-emit-project --output-file /tmp/pg-task-runtime.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/pg-task-runtime.txt --progress-spinner off

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package index metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Validate wheel installation outside checkout
        run: |
          uv venv /tmp/pg-task-wheel --python 3.13
          uv pip install --python /tmp/pg-task-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/pg-task-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pg_task_engine import TaskEngine, Worker, JobRequest, MigrationError, __version__

          assert version("pg-task-engine") == __version__
          for name in ("001_initial.sql", "002_deadline_recovery_index.sql"):
              assert files("pg_task_engine").joinpath("migrations", name).is_file()
          from importlib.metadata import metadata
          assert metadata("pg-task-engine")["License-Expression"] == "MIT"
          print("Independent wheel installation OK")
          PY

      - name: Store exact verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    if: ${{ inputs.registry == 'testpypi' }}
    needs: verify-distribution
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI using OpenID Connect
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: ${{ inputs.registry == 'pypi' }}
    needs: verify-distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI using OpenID Connect
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
