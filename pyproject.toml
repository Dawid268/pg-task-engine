[project]
name = "pg-task-engine"
version = "0.1.0a3"
description = "A typed PostgreSQL-backed durable task queue for Python."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pg-task-engine contributors" }]
keywords = [
    "postgresql",
    "durable-tasks",
    "task-queue",
    "background-jobs",
    "workers",
]
dependencies = [
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Dawid268/pg-task-engine"
Source = "https://github.com/Dawid268/pg-task-engine"
Issues = "https://github.com/Dawid268/pg-task-engine/issues"
Documentation = "https://github.com/Dawid268/pg-task-engine/blob/main/docs/OPERATIONS.md"
Changelog = "https://github.com/Dawid268/pg-task-engine/blob/main/CHANGELOG.md"

[project.scripts]
pg-task-engine = "pg_task_engine.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

# Adapted from touchpoint-taxonomy. The reference app is NOT a wheel dependency.
[dependency-groups]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]
dev = [
    { include-group = "api" },
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "pytest-mock>=3,<4",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
# Rule families follow touchpoint-taxonomy; exceptions are narrowed for a library.
select = [
    "A", "B", "C", "COM", "E", "F", "I", "W", "ASYNC", "FBT", "C4",
    "T10", "T20", "Q", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "ERA",
    "PGH", "PL", "RUF", "UP", "ANN", "S", "BLE", "ISC", "ICN", "PIE",
    "PT", "PTH", "TD",
]
ignore = [
    "B008",    # Dependency declarations may contain function calls.
    "FBT001",  # Typed settings and framework hooks use booleans.
    "FBT002",
    "FBT003",
    "COM812",  # The Ruff formatter owns trailing commas.
    "ISC001",  # Avoid conflicts with the formatter.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001"]
"src/pg_task_engine/engine.py" = ["PLR0913", "PLR0917"]  # Explicit transactional APIs.

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
markers = ["postgres: requires a dedicated PostgreSQL database ending in _test"]
# Only the repository-only reference app needs this. The wheel is tested separately.
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["pg_task_engine", "app"]
omit = ["app/main.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
